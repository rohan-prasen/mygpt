[project]
name = "mygpt"
version = "1.0.0.dev2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rohan Prasen Kedari", email = "rohanprasenkedari@gmail.com" },
]
requires-python = ">=3.12"
dependencies = ["numpy>=2.5.4"]

[project.scripts]
mygpt = "mygpt:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
